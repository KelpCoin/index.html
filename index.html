<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Arbitrage Status Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --ok: #4ade80;
      --warn: #f59e0b;
      --missing: #f87171;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px;
      background: radial-gradient(circle at 20% 20%, rgba(74, 222, 128, 0.06), transparent 35%),
                  radial-gradient(circle at 80% 0%, rgba(59, 130, 246, 0.05), transparent 30%),
                  var(--bg);
      font-family: "Segoe UI", "Inter", sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    header {
      text-align: center;
      max-width: 800px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.75rem, 2vw, 2.25rem);
    }

    p.subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .grid {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover { border-color: #374151; transform: translateY(-2px); }

    .label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .value {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .ok { color: var(--ok); }
    .warning { color: var(--warn); }
    .missing { color: var(--missing); }

    .footer {
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>MTG Arbitrage System Status</h1>
    <p class="subtitle">Live indicators for automation and outbound integrations. Updated every 30 seconds.</p>
  </header>

  <section class="grid" id="status-grid">
    <div class="card">
      <div class="label">
        <span>Queue Runner (Scheduled Task)</span>
        <span class="value" data-field="queueRunner">–</span>
      </div>
    </div>
    <div class="card">
      <div class="label">
        <span>LearnBot (Scheduled Task)</span>
        <span class="value" data-field="learnBot">–</span>
      </div>
    </div>
    <div class="card">
      <div class="label">
        <span>Results CSV</span>
        <span class="value" data-field="resultsCsv">–</span>
      </div>
    </div>
    <div class="card">
      <div class="label">
        <span>Discord Webhook Variable</span>
        <span class="value" data-field="discordWebhook">–</span>
      </div>
    </div>
  </section>

  <div class="footer" id="timestamp">Awaiting status…</div>

  <script>
    const STATUS_CLASSES = {
      OK: 'ok',
      WARNING: 'warning',
      MISSING: 'missing'
    };

    const STATUS_URL = '/Data/System/status.json';
    const timestampEl = document.getElementById('timestamp');
    const valueEls = {
      queueRunner: document.querySelector('[data-field="queueRunner"]'),
      learnBot: document.querySelector('[data-field="learnBot"]'),
      resultsCsv: document.querySelector('[data-field="resultsCsv"]'),
      discordWebhook: document.querySelector('[data-field="discordWebhook"]'),
    };

    function applyStatus(el, status) {
      el.textContent = status || '—';
      el.classList.remove('ok', 'warning', 'missing');
      if (status && STATUS_CLASSES[status]) {
        el.classList.add(STATUS_CLASSES[status]);
      }
    }

    async function refreshStatus() {
      try {
        const response = await fetch(STATUS_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        applyStatus(valueEls.queueRunner, data.queueRunner);
        applyStatus(valueEls.learnBot, data.learnBot);
        applyStatus(valueEls.resultsCsv, data.resultsCsv);
        applyStatus(valueEls.discordWebhook, data.discordWebhook);

        const ts = data.timestampUtc ? new Date(data.timestampUtc).toLocaleString() : 'Unknown time';
        timestampEl.textContent = `Last update: ${ts}`;
      } catch (err) {
        Object.values(valueEls).forEach(el => applyStatus(el, 'MISSING'));
        timestampEl.textContent = `Last update failed: ${err.message}`;
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 30000);
  </script>
</body>
</html>
