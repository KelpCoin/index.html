<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrownEye Cinema Doorway</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at top, #2b2f44, #0d0f18 68%);
        color: #f3f5ff;
        display: grid;
        place-items: center;
      }
      main {
        width: min(420px, 94vw);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.25rem;
      }
      .pill { font-size: .75rem; letter-spacing: .08em; opacity: .8; }
      h1 { margin: .25rem 0 .5rem; font-size: clamp(1.6rem, 5vw, 2rem); }
      .cta { display: grid; gap: .6rem; }
      a.btn {
        text-decoration: none;
        text-align: center;
        padding: .85rem 1rem;
        border-radius: .8rem;
        font-weight: 700;
      }
      .pay { background:#4f7dff; color:white; }
      .preview { background:#1f2438; color:#dbe4ff; border:1px solid #3b4469; }
      .proof {
        font-size: .82rem;
        padding: .75rem;
        border: 1px solid #344066;
        border-radius: .65rem;
        background: rgba(17,22,38,.7);
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="pill">BROWNEYE CINEMA • MOBILE FROZEN SPEC</div>
        <h1>Doorway → Pay → Delivery</h1>
        <p>One-screen payment doorway for paid event access. Public posting is disabled until explicit approval.</p>
      </section>

      <section class="cta">
        <a class="btn pay" href="https://pay.example.com/test-checkout" target="_blank" rel="noopener">Pay (test rail placeholder)</a>
        <a class="btn preview" href="billboard.html">Open Billboard Wall</a>
        <div class="proof" id="proofLine">Proof target: generated by cycle script.</div>
      </section>
    </main>
  </body>
</html>
