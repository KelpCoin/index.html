<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arbitrage Dashboard</title>
  <style>
    :root {
      --green: #0ea55f;
      --green-light: #e8f6ed;
      --text: #1f2933;
      --muted: #4b5563;
      --border: #d1d5db;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: var(--green-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 40px 16px 56px;
      color: var(--text);
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 0.25rem 0;
    }
    p {
      font-size: 1rem;
      margin: 0 0 24px 0;
      color: var(--muted);
      text-align: center;
      max-width: 700px;
    }
    .panel {
      width: 100%;
      max-width: 780px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #0a7d47;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s ease;
    }
    .action:focus,
    .action:hover {
      background: #0c8f52;
      box-shadow: 0 8px 18px rgba(14, 165, 95, 0.25);
      transform: translateY(-1px);
    }
    iframe {
      border: none;
      width: 100%;
      height: 820px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Arbitrage Dashboard</h1>
  <p>Run the queued tasks, kick off LearnBot, or open the latest results CSV directly from this dashboard.</p>

  <div class="panel">
    <div class="actions">
      <a class="action" href="file://C:/BrownEyeCortex/Bootstraps/Launch_RunQueue.ps1">Run Queue Now</a>
      <a class="action" href="file://C:/BrownEyeCortex/Bootstraps/Launch_LearnBot.ps1">Run LearnBot</a>
      <a class="action" href="file://C:/BrownEyeCortex/Bootstraps/Launch_OpenResults.ps1">Open Results CSV</a>
    </div>
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSclYfRXBxHoDBjpoHCoKM2_lm8VkxN8FjqmkOeK5kqxiOMW9A/viewform?embedded=true"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
