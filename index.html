<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Private Intake Form</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0fdf4;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 40px;
    }
    .notice {
      background: #0f172a;
      color: #f8fafc;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      letter-spacing: 0.01em;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1rem;
      margin-bottom: 2rem;
      color: #555;
      text-align: center;
      max-width: 640px;
    }
    iframe {
      border: none;
      width: 100%;
      max-width: 700px;
      height: 800px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="notice">Private intake — do not share publicly without approval.</div>
  <h1>Private Intake Form</h1>
  <p>Submit your details using the secure form below. We will review and follow up as needed.</p>
  <iframe 
    src="https://docs.google.com/forms/d/e/1FAIpQLSclYfRXBxHoDBjpoHCoKM2_lm8VkxN8FjqmkOeK5kqxiOMW9A/viewform?embedded=true"
    allowfullscreen>
  </iframe>
</body>
</html>
